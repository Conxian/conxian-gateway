services:
  - type: web
    name: conxian-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: gateway-state
      mountPath: /usr/app
      sizeGB: 5
    envVars:
      - key: GATEWAY_STATE_PATH
        value: /usr/app/gateway_state.json
      - key: GATEWAY_PERSISTENCE_MODE
        value: exclusive-local-writer
      - key: GATEWAY_ALLOW_UNKNOWN_STATE_FILESYSTEM
        value: "false"
      - key: BITCOIN_RPC_URL
        value: https://bitcoin-rpc.publicnode.com
      - key: STACKS_RPC_URL
        value: https://api.mainnet.hiro.so
      - key: RUST_LOG
        value: info
      - key: API_TOKEN
        sync: false
      - key: FIAT_WEBHOOK_SECRET
        sync: false
      - key: SETTLEMENT_INGRESS_SECRET
        sync: false
      - key: RAMP_MODE
        value: disabled
      - key: RAMP_API_KEY
        sync: false
      - key: STITCH_MODE
        value: disabled
      - key: OZOW_MODE
        value: disabled
      - key: ALCHEMY_PAY_MODE
        value: disabled
      - key: ALCHEMY_PAY_APP_ID
        sync: false
      - key: BANXA_MODE
        value: disabled
      - key: INFOBIP_MODE
        value: disabled
      - key: INFOBIP_API_KEY
        sync: false
      - key: HMAC_SECRET
        sync: false
      - key: OFFLINE_QUEUE_SECRET
        sync: false
      # ── Managed SaaS Gateway (multi-tenant indie agent surface) ──
      - key: MANAGED_API_KEYS
        sync: false
      - key: FUSION_JWT_SECRET
        sync: false
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "120"
      - key: TOKEN_TTL_SECONDS
        value: "86400"
      - key: GATEWAY_PUBLIC_HOST
        value: gateway.conxian.org
      - key: MANAGED_SUBSCRIBER_HOST
        value: api.conxian-labs.com
