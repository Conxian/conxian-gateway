[workspace]
resolver = "2"
members = [
    "cmd/gateway",
    "internal/engine",
    "internal/api",
    "internal/compliance",
    "pkg/conxian-core",
]

[workspace.package]
rust-version = "1.96"
version = "0.1.5"
edition = "2021"
authors = ["Conxian Gateway Contributors"]
license = "MIT"
description = "Institutional-grade Bitcoin/Stacks Gateway"

[workspace.dependencies]
lib-conxian-core = { git = "https://github.com/Conxian/lib-conxian-core", rev = "73143c2b916a6c0f3cf9117ea36c0ae1e170d9d4" }
urlencoding = "2.1.3"
blake2 = "0.10.6"
minreq = { version = "3.0.0", features = ["https"] }
# Pin below 0.40.1 because that resolves libsqlite3-sys 0.38.1, whose build.rs uses unstable cfg_select on stable toolchains.
rusqlite = { version = "=0.40.1", features = ["bundled"] }
aes-gcm = "0.11.0"
# Bitcoin & Stacks
bitcoin = { version = "0.32.100", features = ["std", "serde", "rand", "secp-recovery"] }
secp256k1 = { version = "0.29.1", features = ["global-context", "recovery", "rand"] }
bitcoincore-rpc = { version = "0.19.0" }

# Async & Runtime
tokio = { version = "1.52.3", features = ["full"] }
futures = { version = "0.3.31" }
async-trait = { version = "0.1.88" }

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha2 = { version = "0.11.0" }

# HTTP & API
axum = { version = "0.8.4" }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
axum-test = "21.0.0"
hyper = { version = "1.10.1", features = ["full"] }
url = "2.5.8"
redis = { version = "1.3.0", features = ["tokio-rustls-comp", "json"] }

# Utilities & Error Handling
anyhow = { version = "1.0.98" }
subtle = { version = "2.6.1" }
thiserror = { version = "2.0.18" }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
fs2 = "0.4.3"
libc = "0.2.183"

# Internal crates
conxian_engine = { path = "internal/engine" }
conxian_api = { path = "internal/api" }
conxian_compliance = { path = "internal/compliance" }
conxian_core = { path = "pkg/conxian-core" }
