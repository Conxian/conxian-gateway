# CircleCI lane: activates as soon as the project is set up in CircleCI.
version: 2.1
jobs:
  test:
    docker:
      - image: cimg/rust:1.100.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: system deps
          command: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev > /dev/null
      - restore_cache:
          keys:
            - cargo-{{ checksum "Cargo.lock" }}
      - run:
          name: test
          command: cargo test --locked --lib
      - save_cache:
          key: cargo-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - target
  js-tests:
    docker:
      - image: cimg/node:26.13.1
    parallelism: 2
    resource_class: medium
    steps:
      - checkout
      - run:
          name: install
          command: sudo npm install -g pnpm@11.28.9 && pnpm install --frozen-lockfile --ignore-scripts
      - run:
          name: install the Smarter Testing CLI
          command: |
            curl -fLSs https://circle.ci/cli | sudo bash
            circleci extension install testsuite
      - run:
          name: client-sdk tests (split by timing across nodes)
          command: circleci testsuite run "js"
workflows:
  ci:
    jobs: [test, js-tests]
