apiVersion: apps/v1
kind: Deployment
metadata:
  name: conxian-gateway
  namespace: conxian
  labels:
    app: conxian-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: conxian-gateway
  template:
    metadata:
      labels:
        app: conxian-gateway
    spec:
      containers:
        - name: gateway
          image: gcr.io/conxian-project/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: RUST_LOG
              value: "info"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: conxian-gateway-service
  namespace: conxian
spec:
  selector:
    app: conxian-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
