version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-typescript-major:
        patterns:
          - "typescript"
          - "@typescript/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
        update-types:
          - "major"
      npm-typescript-updates:
        patterns:
          - "typescript"
          - "@typescript/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "@typescript/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
