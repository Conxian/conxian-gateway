name: Node.js CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript compiler split
        run: |
          test "$(pnpm exec tsc --version)" = "Version 7.0.2"
          test "$(pnpm --filter control-plane exec tsc --version)" = "Version 7.0.2"
          test "$(pnpm --filter @conxian/client-sdk exec tsc --version)" = "Version 7.0.2"
          test "$(pnpm --filter @conxian/schemas exec tsc --version)" = "Version 7.0.2"
          test "$(pnpm --filter @conxian/developer-sandbox exec tsc --version)" = "Version 7.0.2"
          test "$(pnpm --filter control-plane exec node -p 'require("@typescript/native/package.json").name')" = "typescript"
          test "$(pnpm --filter control-plane exec node -p 'require("@typescript/native/package.json").version')" = "7.0.2"
          test "$(pnpm --filter control-plane exec node -p 'require("typescript/package.json").name')" = "@typescript/typescript6"
          test "$(pnpm --filter control-plane exec node -p 'require("typescript/package.json").version')" = "6.0.2"
          pnpm --filter control-plane exec tsc6 --version | grep -Eq '^Version 6\.'

      - name: Typecheck workspaces with TypeScript 7
        run: pnpm typecheck

      - name: Lint workspaces
        run: pnpm lint

      - name: Build workspaces
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm --filter control-plane exec playwright install --with-deps

      - name: Run tests
        run: pnpm test
