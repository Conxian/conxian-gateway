name: Container initialization

on:
  pull_request:
    branches: [dev, staged, main]
    paths: [Dockerfile, .dockerignore, render.yaml, 'cmd/**', 'internal/**', 'pkg/**', Cargo.toml, Cargo.lock, 'scripts/container_init_smoke.py', 'scripts/startup_secret_preflight.py', 'scripts/test_startup_secret_preflight.py', 'scripts/verify_required_secrets.py', 'tests/test_verify_required_secrets.py', '.github/workflows/container-init.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify redacted startup preflight
        run: python3 -m unittest discover -s scripts -p test_startup_secret_preflight.py
      - name: Verify conditional deploy declaration guard
        run: |
          python3 -m unittest discover -s tests -p test_verify_required_secrets.py
          python3 scripts/verify_required_secrets.py
      - name: Build locked release image
        run: docker build --tag conxian-gateway:init .
      - name: Exercise initialization, authentication, state ownership and restart
        run: python3 scripts/container_init_smoke.py --image conxian-gateway:init

