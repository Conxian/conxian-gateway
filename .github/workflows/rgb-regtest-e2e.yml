name: RGB Regtest E2E

on:
  pull_request:
    branches: [main, staged, dev]
    paths:
      - ".github/workflows/rgb-regtest-e2e.yml"
      - "tests/rgb/**"
      - "internal/engine/src/bitcoin/rgb_issuer_policy.rs"
      - "internal/engine/src/bitcoin/rgb_stash.rs"
      - "internal/engine/tests/rgb_regtest_transition.rs"
      - "internal/engine/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main, staged, dev]
    paths:
      - ".github/workflows/rgb-regtest-e2e.yml"
      - "tests/rgb/**"
      - "internal/engine/src/bitcoin/rgb_issuer_policy.rs"
      - "internal/engine/src/bitcoin/rgb_stash.rs"
      - "internal/engine/tests/rgb_regtest_transition.rs"
      - "internal/engine/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rgb-regtest-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rgb-regtest-e2e:
    name: Bitcoin-signed RGB transition proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Run RGB issuer and stash baseline tests
        run: |
          cargo test -p conxian_engine --features rgb-native bitcoin::rgb_issuer_policy::tests -- --nocapture
          cargo test -p conxian_engine --features rgb-native bitcoin::rgb_stash::tests -- --test-threads=1

      - name: Run RGB artifact guard regressions
        run: bash tests/rgb/test_rgb_artifact_guard.sh

      - name: Run pinned Bitcoin Core RGB proof
        run: bash tests/rgb/rgb_regtest_e2e.sh

      - name: Upload RGB proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rgb-regtest-e2e-artifacts
          path: target/rgb-regtest-artifacts
          if-no-files-found: warn
