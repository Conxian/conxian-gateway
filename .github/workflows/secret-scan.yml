name: Secret Scan

on:
  pull_request:
    branches: [ main, staged, dev ]
  push:
    branches: [ main, staged, dev ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Gitleaks
        run: |
          VERSION="8.18.2"
          TMPDIR="$(mktemp -d)"
          curl -sSLo "$TMPDIR/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz
          tar -xzf "$TMPDIR/gitleaks.tar.gz" -C "$TMPDIR" gitleaks
          sudo install -m 0755 "$TMPDIR/gitleaks" /usr/local/bin/gitleaks

      - name: Gitleaks Scan
        run: gitleaks detect --source . --verbose --redact --no-git --gitleaks-ignore
