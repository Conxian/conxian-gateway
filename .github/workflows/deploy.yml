name: Deploy Gateway

# Continuous delivery for the MANAGED gateway (Render service
# the RENDER_SERVICE_ID repository variable -> https://gateway.conxian.org).
#
# Gated on `main` so a deployment only follows a release that has cleared
# dev -> staged -> main promotion and the release gate. The sovereign reference
# droplet is intentionally NOT a target here; see docs/DEPLOY_MODES.md and
# scripts/deploy-sovereign.sh.

on:
  push:
    branches:
      - main
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Read from the repository variable so the real Render service id is
  # never hardcoded (a placeholder here silently 404s every deploy).
  RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
  PUBLIC_BASE_URL: https://gateway.conxian.org

jobs:
  deploy:
    name: Deploy managed gateway and smoke-check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require managed deploy credential
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY}" ]]; then
            echo "error: RENDER_API_KEY is not configured in the production environment" >&2
            exit 1
          fi

      - name: Trigger managed deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /tmp/deploy.json -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'content-type: application/json' \
            -d '{"clearCache":"do_not_clear"}')"
          if [[ "${code}" != "201" && "${code}" != "200" ]]; then
            echo "error: Render deploy trigger returned ${code}" >&2
            exit 1
          fi

      - name: Wait for managed deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          deploy_id="$(python3 -c 'import json;print(json.load(open("/tmp/deploy.json")).get("id",""))')"
          if [[ -z "${deploy_id}" ]]; then
            echo "error: deploy id unavailable" >&2
            exit 1
          fi
          for attempt in $(seq 1 60); do
            status="$(curl -s "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status","unknown"))')"
            echo "attempt ${attempt}: status=${status}"
            case "${status}" in
              live) echo "managed deploy live"; exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "error: managed deploy ${status}" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "error: managed deploy did not reach live within timeout" >&2
          exit 1

      - name: Smoke-check managed public surface
        run: |
          set -euo pipefail
          for spec in "health:200" "version:200" "billing/balance?tenant_id=smoke:200"; do
            path="${spec%:*}"; want="${spec##*:}"
            code="$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_BASE_URL}/api/v1/${path}")"
            echo "/api/v1/${path} -> ${code}"
            if [[ "${code}" != "${want}" ]]; then
              echo "error: /api/v1/${path} returned ${code}; expected ${want}" >&2
              exit 1
            fi
          done
