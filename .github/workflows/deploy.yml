name: Deploy Gateway

# Continuous delivery to the production VPS. Gated on `main` so a deployment
# only follows a release that has cleared dev -> staged -> main promotion and
# the release gate. Requires the secrets listed in docs/DEPLOY_AND_LOAD.md.

on:
  push:
    branches:
      - main
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: conxian-gateway

jobs:
  deploy:
    name: Build image and deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag "${IMAGE}:${GITHUB_SHA::12}" --tag "${IMAGE}:latest" .

      - name: Export image archive
        id: archive
        run: |
          archive="gateway-${GITHUB_SHA::12}.tar.gz"
          docker save "${IMAGE}:latest" | gzip -n > "${archive}"
          echo "name=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-image
          path: "${{ steps.archive.outputs.name }}"
          if-no-files-found: error
          retention-days: 1

      - name: Deploy to production over SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          for var in PROD_SSH_HOST PROD_SSH_USER PROD_SSH_KEY; do
            if [[ -z "${!var}" ]]; then
              echo "error: ${var} is not configured in the production environment" >&2
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          printf '%s\n' "${PROD_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${PROD_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          archive="gateway-${GITHUB_SHA::12}.tar.gz"
          remote="${PROD_SSH_USER}@${PROD_SSH_HOST}"

          # Keep the current image as a rollback target.
          ssh -i ~/.ssh/id_deploy "${remote}" \
            "docker tag ${IMAGE}:latest ${IMAGE}:previous 2>/dev/null || true"

          scp -i ~/.ssh/id_deploy "${archive}" "${remote}:/tmp/${archive}"

          ssh -i ~/.ssh/id_deploy "${remote}" \
            "set -euo pipefail; \
             gunzip -c /tmp/${archive} | docker load; \
             docker stop ${IMAGE} 2>/dev/null || true; \
             docker rm ${IMAGE} 2>/dev/null || true; \
             docker run -d --name ${IMAGE} \
               --restart unless-stopped \
               -p 3000:3000 \
               --env-file /etc/conxian/gateway.env \
               ${IMAGE}:latest; \
             rm -f /tmp/${archive}; \
             echo 'deployed ${archive}'"

      - name: Smoke-check health and billing endpoints
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${PROD_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${PROD_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          remote="${PROD_SSH_USER}@${PROD_SSH_HOST}"
          for spec in "health" "billing/balance?tenant_id=smoke"; do
            code="$(ssh -i ~/.ssh/id_deploy "${remote}" \
              "curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/${spec}'")"
            echo "/${spec} -> ${code}"
            if [[ "${code}" != "200" ]]; then
              echo "error: /${spec} returned ${code}; expected 200" >&2
              exit 1
            fi
          done
