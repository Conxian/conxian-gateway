name: Client SDK contract conformance

on:
  pull_request:
    branches: [dev, staged, main]
    paths:
      - 'packages/client-sdk/**'
      - 'packages/schemas/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/client-sdk-conformance.yml'
  push:
    branches: [dev, staged, main]
    paths:
      - 'packages/client-sdk/**'
      - 'packages/schemas/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/client-sdk-conformance.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @conxian/schemas build
      - run: pnpm --filter @conxian/client-sdk typecheck
      - run: pnpm --filter @conxian/client-sdk test
      - run: pnpm --filter @conxian/client-sdk build
