name: Liquid E2E

on:
  pull_request:
    branches: [main, staged, dev]
    paths:
      - ".github/workflows/liquid-e2e.yml"
      - "tests/liquid/**"
      - "internal/engine/src/bitcoin/liquid_adapter.rs"
      - "internal/compliance/src/verifier.rs"
      - "cmd/gateway/tests/api_tests.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "internal/engine/Cargo.toml"
      - "internal/compliance/Cargo.toml"
      - "internal/api/Cargo.toml"
      - "cmd/gateway/Cargo.toml"
      - "pkg/conxian-core/Cargo.toml"
  push:
    branches: [main, staged, dev]
    paths:
      - ".github/workflows/liquid-e2e.yml"
      - "tests/liquid/**"
      - "internal/engine/src/bitcoin/liquid_adapter.rs"
      - "internal/compliance/src/verifier.rs"
      - "cmd/gateway/tests/api_tests.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "internal/engine/Cargo.toml"
      - "internal/compliance/Cargo.toml"
      - "internal/api/Cargo.toml"
      - "cmd/gateway/Cargo.toml"
      - "pkg/conxian-core/Cargo.toml"
  workflow_dispatch:
    inputs:
      pegin_confirmation_depth:
        description: "Elements peg-in confirmation depth (2-1000; effective target is max(102, depth + 2))"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: liquid-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  liquid-e2e:
    name: Elements peg-in/peg-out harness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      LIQUID_PEGIN_CONFIRMATION_DEPTH: ${{ github.event_name == 'workflow_dispatch' && inputs.pegin_confirmation_depth || '100' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Run fail-closed Liquid adapter tests
        run: cargo test -p conxian_engine liquid_adapter --lib

      - name: Run pinned Bitcoin/Elements daemon harness
        run: bash tests/liquid/liquid_peg_e2e.sh

      - name: Upload Liquid daemon logs and proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: liquid-e2e-artifacts
          path: target/liquid-e2e-artifacts
          if-no-files-found: warn
