name: Rust CI

on:
  pull_request:
    branches: [main, staged, dev]
  push:
    branches: [main, staged, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  msrv:
    name: MSRV (Rust 1.98.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout lib-conxian-core
        run: git clone --depth 1 https://github.com/Conxian/lib-conxian-core.git ../lib-conxian-core

      - name: Install declared minimum Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.7.7

      - name: Check locked workspace at declared MSRV
        run: cargo check --workspace --locked

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout lib-conxian-core
        run: git clone --depth 1 https://github.com/Conxian/lib-conxian-core.git ../lib-conxian-core

      - name: Verify immutable workflow action pins
        run: |
          python3 scripts/verify_github_action_pins.py
          python3 tests/test_verify_github_action_pins.py

      - name: Verify no prohibited tracked artifacts
        run: |
          python3 scripts/verify_tracked_artifacts.py
          python3 tests/test_verify_tracked_artifacts.py

      - name: Verify release hygiene
        run: |
          python3 scripts/verify_release_hygiene.py
          python3 tests/test_verify_release_hygiene.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Contamination Guard
        run: python3 scripts/verify_contamination_guard.py

      - name: Verify required secrets declared
        run: |
          python3 -m unittest discover -s scripts -p test_startup_secret_preflight.py
          python3 -m unittest discover -s tests -p test_verify_required_secrets.py
          python3 scripts/verify_required_secrets.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout lib-conxian-core
        run: git clone --depth 1 https://github.com/Conxian/lib-conxian-core.git ../lib-conxian-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.7.7

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout lib-conxian-core
        run: git clone --depth 1 https://github.com/Conxian/lib-conxian-core.git ../lib-conxian-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.7.7

      - name: Run tests
        run: cargo test --workspace

      - name: Run identity tests (mock-integrations)
        run: cargo test --workspace --features mock-integrations

      - name: Validate CLI Compose interpolation without starting services
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import tempfile

          binary = pathlib.Path("target/debug/conxian-cli").resolve()
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([str(binary), "init"], cwd=directory, check=True)
              command = ["docker", "compose", "--env-file", ".env.production", "config", "--quiet"]
              environment = {key: value for key, value in os.environ.items() if key not in ("GATEWAY_IMAGE", "API_PORT")}
              result = subprocess.run(command, cwd=directory, env=environment, capture_output=True)
              assert result.returncode != 0, "An image must be explicitly selected"
              environment["GATEWAY_IMAGE"] = "example.invalid/gateway@sha256:" + "0" * 64
              environment["API_PORT"] = "18080"
              result = subprocess.run(command, cwd=directory, env=environment, capture_output=True)
              assert result.returncode == 0, "Generated Compose must validate with explicit configuration"
              result = subprocess.run(command[:-1] + ["--format", "json"], cwd=directory, env=environment, capture_output=True, check=True)
              service = json.loads(result.stdout)["services"]["conxian-gateway"]
              assert service["environment"]["API_PORT"] == "18080"
              assert service["ports"][0]["target"] == 18080
              assert service["ports"][0]["published"] == "18080"
              assert service["ports"][0]["host_ip"] == "127.0.0.1"
          PY

  rgb-native:
    name: RGB Native Feature Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout lib-conxian-core
        run: git clone --depth 1 https://github.com/Conxian/lib-conxian-core.git ../lib-conxian-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.7.7

      - name: Test engine RGB native feature
        run: cargo test -p conxian_engine --features rgb-native

      - name: Test gateway RGB native feature
        run: cargo test -p gateway --features rgb-native

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout lib-conxian-core
        run: git clone --depth 1 https://github.com/Conxian/lib-conxian-core.git ../lib-conxian-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.7.7

      - name: Build release
        run: cargo build --release
