name: Lightning Adapter Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lightning-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e732dd5d71b7c0146305a7674254f15d91834220 # v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23bce30071988890ae5738b22300b850231908bc # v2.7.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b7849c7f1a8e1329d9e685f651c68f6a96e622b7 # v2

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Enforce Lightning scoped coverage gate
        run: ./scripts/lightning_coverage_gate.sh 90

      - name: Publish Lightning coverage summary
        if: always()
        run: |
          if [ -f target/lightning-coverage/summary.md ]; then
            cat target/lightning-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Lightning coverage summary missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lightning coverage artifact
        if: always()
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: lightning-coverage-summary
          path: target/lightning-coverage
          if-no-files-found: warn
