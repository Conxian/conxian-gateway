name: Lightning Adapter Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lightning-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.7.7

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Enforce Lightning scoped coverage gate
        run: ./scripts/lightning_coverage_gate.sh 90

      - name: Publish Lightning coverage summary
        if: always()
        run: |
          if [ -f target/lightning-coverage/summary.md ]; then
            cat target/lightning-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Lightning coverage summary missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lightning coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: lightning-coverage-summary
          path: target/lightning-coverage
          if-no-files-found: warn
