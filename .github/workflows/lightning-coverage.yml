name: Lightning Adapter Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lightning-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb # v2.7.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # v2

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Enforce Lightning scoped coverage gate
        run: ./scripts/lightning_coverage_gate.sh 90

      - name: Publish Lightning coverage summary
        if: always()
        run: |
          if [ -f target/lightning-coverage/summary.md ]; then
            cat target/lightning-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Lightning coverage summary missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lightning coverage artifact
        if: always()
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: lightning-coverage-summary
          path: target/lightning-coverage
          if-no-files-found: warn
