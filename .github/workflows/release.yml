name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (X.Y.Z or vX.Y.Z)'
        required: true
        type: string
      publish_to_crates_io:
        description: 'Publish to crates.io after validation (manual only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a2187f5ba5127f311e0e29080 # v2.0.6
        with:
          generate_release_notes: true
          body: |
            Automated release for `${{ github.ref_name }}`.

            See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for full release notes.

  validate-release:
    name: Validate release metadata and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version matches Cargo.toml
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          version="${version#v}"
          cargo_version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ "${version}" != "${cargo_version}" ]]; then
            echo "error: tag version ${version} != Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          echo "Version ${version} matches Cargo.toml"

      - name: Run tests
        run: cargo test --locked

      - name: Verify crates.io package (dry-run)
        run: cargo publish --dry-run

  sbom-and-provenance:
    name: SBOM Generation & Build Provenance
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@a10e8e2f7505ee00d2e49d38b5957de6bbb647b1 # v2
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo cyclonedx --all --spec-version 1.5 \
            --output-format json \
            --override-name conxian-gateway \
            --override-version "${VERSION}" \
            -f sbom.cdx.json || true
          if [ -f sbom.cdx.json ]; then
            echo "SBOM generated: $(wc -c < sbom.cdx.json) bytes"
          else
            echo "::warning::SBOM generation skipped (cargo-cyclonedx may not support workspace)"
            echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > sbom.cdx.json
          fi

      - name: Generate dependency graph (SBOM alternate)
        shell: bash
        run: |
          cargo metadata --format-version=1 --no-deps > cargo-metadata.json
          echo "Dependency metadata generated"

      - name: Attest build provenance (SLSA L3)
        uses: actions/attest-build-provenance@5d9a45e741f13da0d7ded04c3e32c7e52c7e0d0b # v2.2.3
        with:
          subject-path: |
            sbom.cdx.json
            cargo-metadata.json

      - name: Upload SBOM to release
        shell: bash
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          gh release upload "${RELEASE_TAG}" sbom.cdx.json cargo-metadata.json \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to crates.io (manual gate)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_crates_io }}
    needs: validate-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Enforce publish from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "error: publishing allowed only from a release tag" >&2
            exit 1
          fi

      - name: Verify CARGO_REGISTRY_TOKEN
        shell: bash
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "error: CARGO_REGISTRY_TOKEN not set in release environment" >&2
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "${CARGO_REGISTRY_TOKEN}"
