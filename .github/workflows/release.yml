name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Confirm the tag version (X.Y.Z or vX.Y.Z)'
        required: true
        type: string
      publish_to_crates_io:
        description: 'Publish gateway to crates.io after the GitHub release (manual gate)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_TRIPLE: x86_64-unknown-linux-gnu
  RUST_TOOLCHAIN: 1.96.0

jobs:
  validate-release:
    name: Validate, build, and package release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      target: ${{ steps.package.outputs.target }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Determine and validate release tag
        id: version
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "error: release workflows must run from a tag; selected ref is ${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tag must match vMAJOR.MINOR.PATCH; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            input_version="${RELEASE_VERSION_INPUT#v}"
            if [[ "${input_version}" != "${tag_version}" ]]; then
              echo "error: release_version input ${RELEASE_VERSION_INPUT} does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi

          printf 'value=%s\n' "${tag_version}" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Verify tag identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} resolves to ${tag_commit}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi
          printf 'commit=%s\n' "${tag_commit}" >> "${GITHUB_OUTPUT}"
          test -f CHANGELOG.md

      - name: Validate workspace package versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps > "${RUNNER_TEMP}/cargo-metadata.json"
          python3 - "${RUNNER_TEMP}/cargo-metadata.json" "${RELEASE_VERSION}" <<'PY'
          import json
          import sys

          metadata_path, release_version = sys.argv[1:]
          metadata = json.load(open(metadata_path, encoding="utf-8"))
          packages = metadata["packages"]
          gateway = next((package for package in packages if package["name"] == "gateway"), None)
          if gateway is None:
              raise SystemExit("error: cargo metadata did not contain the gateway package")
          if gateway["version"] != release_version:
              raise SystemExit(
                  f"error: gateway package is {gateway['version']}, expected {release_version}"
              )
          mismatches = [
              f"{package['name']}={package['version']}"
              for package in packages
              if package["version"] != release_version
          ]
          if mismatches:
              raise SystemExit(
                  "error: workspace package versions do not match the release: "
                  + ", ".join(mismatches)
              )
          print(f"workspace package versions match {release_version}")
          PY

      - name: Run release validation checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --locked
          cargo test --workspace --features mock-integrations --locked
          python3 scripts/verify_contamination_guard.py

      - name: Install target
        run: rustup target add "${TARGET_TRIPLE}"

      - name: Build production Gateway binary
        id: package
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          cargo build --locked --release --package gateway --bin gateway --target "${TARGET_TRIPLE}"
          binary="target/${TARGET_TRIPLE}/release/gateway"
          test -s "${binary}"

          stage_root="${RUNNER_TEMP}/conxian-gateway-${RELEASE_VERSION}-${TARGET_TRIPLE}"
          mkdir -p "${stage_root}"
          install -m 0755 "${binary}" "${stage_root}/gateway"
          printf '%s\n' \
            "artifact=conxian-gateway" \
            "version=${RELEASE_VERSION}" \
            "target=${TARGET_TRIPLE}" \
            "commit=${GITHUB_SHA}" \
            "toolchain=${RUST_TOOLCHAIN}" \
            'source-date-epoch=0' \
            > "${stage_root}/RELEASE-METADATA.txt"

          mkdir -p release-assets
          archive="release-assets/conxian-gateway-${RELEASE_VERSION}-${TARGET_TRIPLE}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "${RUNNER_TEMP}" -cf - "conxian-gateway-${RELEASE_VERSION}-${TARGET_TRIPLE}" \
            | gzip -n > "${archive}"
          test -s "${archive}"
          printf 'target=%s\n' "${TARGET_TRIPLE}" >> "${GITHUB_OUTPUT}"

      - name: Install pinned CycloneDX generator
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none

      - name: Generate and normalize CycloneDX SBOM
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          find cmd internal pkg -type f -name "conxian-gateway-${RELEASE_VERSION}.json" -delete
          SOURCE_DATE_EPOCH=0 cargo cyclonedx \
            --manifest-path cmd/gateway/Cargo.toml \
            --all \
            --format json \
            --spec-version 1.5 \
            --override-filename "conxian-gateway-${RELEASE_VERSION}" \
            --target "${TARGET_TRIPLE}" \
            --quiet

          generated="cmd/gateway/conxian-gateway-${RELEASE_VERSION}.json"
          test -s "${generated}"
          python3 scripts/normalize_release_sbom.py \
            --input "${generated}" \
            --output "release-assets/conxian-gateway-${RELEASE_VERSION}.cdx.json" \
            --workspace-root "${GITHUB_WORKSPACE}" \
            --version "${RELEASE_VERSION}" \
            --target "${TARGET_TRIPLE}"
          find cmd internal pkg -type f -name "conxian-gateway-${RELEASE_VERSION}.json" -delete

      - name: Create checksum manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          archive="conxian-gateway-${RELEASE_VERSION}-${TARGET_TRIPLE}.tar.gz"
          sbom="conxian-gateway-${RELEASE_VERSION}.cdx.json"
          checksums="conxian-gateway-${RELEASE_VERSION}.sha256"
          (
            cd release-assets
            sha256sum "${archive}" "${sbom}" > "${checksums}"
            LC_ALL=C sort -k2,2 "${checksums}" -o "${checksums}"
          )

      - name: Verify packaged release artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 scripts/verify_release_artifacts.py \
            --directory release-assets \
            --version "${RELEASE_VERSION}" \
            --target "${TARGET_TRIPLE}"

      - name: Upload immutable release artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest-release:
    name: Attest exact release subjects
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      attestation-url: ${{ steps.provenance.outputs.attestation-url }}
    steps:
      - name: Download immutable release artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
          digest-mismatch: error

      - name: Recheck release checksums before attestation
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c "conxian-gateway-${RELEASE_VERSION}.sha256"

      - name: Generate SLSA build provenance for shipped subjects
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/*.cdx.json

      - name: Require durable attestation record
        shell: bash
        env:
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -n "${ATTESTATION_URL}"

      - name: Preserve provenance bundle for release download
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "${BUNDLE_PATH}"
          mkdir -p release-provenance
          cp "${BUNDLE_PATH}" \
            "release-provenance/conxian-gateway-${RELEASE_VERSION}.provenance.json"

      - name: Upload provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance
          path: release-provenance/*.provenance.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  create-release:
    name: Publish verified GitHub Release
    needs:
      - validate-release
      - attest-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
          digest-mismatch: error

      - name: Download verified provenance bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance
          path: release-provenance
          digest-mismatch: error

      - name: Recheck exact files before publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${EXPECTED_COMMIT}"
          test -s "release-assets/conxian-gateway-${RELEASE_VERSION}-${TARGET_TRIPLE}.tar.gz"
          test -s "release-assets/conxian-gateway-${RELEASE_VERSION}.cdx.json"
          test -s "release-assets/conxian-gateway-${RELEASE_VERSION}.sha256"
          test -s "release-provenance/conxian-gateway-${RELEASE_VERSION}.provenance.json"
          (
            cd release-assets
            sha256sum -c "conxian-gateway-${RELEASE_VERSION}.sha256"
          )
          jq -e \
            --arg version "${RELEASE_VERSION}" \
            '.bomFormat == "CycloneDX" and .specVersion == "1.5" and .metadata.component.name == "gateway" and .metadata.component.version == $version and ((.components // []) | length > 0)' \
            "release-assets/conxian-gateway-${RELEASE_VERSION}.cdx.json" > /dev/null

      - name: Create and publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/*.cdx.json
            release-provenance/*.provenance.json
          body: |
            Automated release for `${{ needs.validate-release.outputs.tag }}`.

            This release was built from `${{ needs.validate-release.outputs.commit }}` for `${{ needs.validate-release.outputs.target }}`.

            Published assets include the production Gateway archive, SHA-256 manifest, CycloneDX 1.5 SBOM, and the signed provenance bundle. The GitHub artifact-attestation summary is available at [the attestation record](${{ needs.attest-release.outputs.attestation-url }}).

            See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ needs.validate-release.outputs.tag }}/CHANGELOG.md) for full release notes.

  publish-crates-io:
    name: Publish Gateway to crates.io (manual environment gate)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_crates_io == true }}
    needs:
      - validate-release
      - create-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify publish identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${EXPECTED_COMMIT}"

      - name: Verify crates.io package before reading secret
        run: cargo publish --dry-run --locked --package gateway

      - name: Verify CARGO_REGISTRY_TOKEN in release environment
        shell: bash
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TOKEN}" ]]; then
            echo "error: CARGO_REGISTRY_TOKEN is not configured in the protected release environment" >&2
            exit 1
          fi

      - name: Publish Gateway to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --package gateway
