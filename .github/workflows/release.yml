name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a2187f5ba5127f311e0e29080 # v2.0.6
        with:
          generate_release_notes: true
          body: |
            Automated release for `${{ github.ref_name }}`.

            See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for full release notes.
