[package]
name = "rust-dlc-stage0-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
dlc = { git = "https://github.com/p2pderivatives/rust-dlc.git", rev = "8e6a75fbc9685e6eafa348edd45a793fcb63fa4d", version = "0.8.0", features = ["use-serde"] }
dlc-manager = { git = "https://github.com/p2pderivatives/rust-dlc.git", rev = "8e6a75fbc9685e6eafa348edd45a793fcb63fa4d", version = "0.8.0", features = ["use-serde"] }
dlc-messages = { git = "https://github.com/p2pderivatives/rust-dlc.git", rev = "8e6a75fbc9685e6eafa348edd45a793fcb63fa4d", version = "0.8.0", features = ["use-serde"] }
lightning = { version = "=0.0.125", default-features = false }
secp256k1-zkp = "=0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
