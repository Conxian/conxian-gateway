packages:
  - 'apps/*'
  - 'examples/*'
  - 'packages/*'
allowBuilds:
  sharp: true
  unrs-resolver: true

# Remediate high-severity transitive advisories (fail-closed on vulnerable ranges).
# brace-expansion 2.x is not covered by either the <1.1.18 or >=4.0.0,<5.0.9
# advisories, so it is pinned here rather than to an EOL 1.x or vulnerable 4/5.x.
overrides:
  js-yaml: ^4.3.1
  postcss: ^8.5.18
  sharp: ^0.35.0
  brace-expansion: ^2.1.7
  source-map-js: ^1.2.2
  vite: ^8.2.4
  # minimatch <11.0.1 (GHSA-g3hv-75wg-m249) reaches us only through
  # @typescript-eslint/typescript-estree; scope the override to that parent so
  # consumers that still need the 3.x API are untouched.
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.4
