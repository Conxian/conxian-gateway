[features]
default = []
rgb-native = ["conxian_engine/rgb-native"]

[lib]
name = "gateway_lib"
path = "src/config.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
conxian_engine.workspace = true
conxian_api.workspace = true
conxian_compliance.workspace = true
conxian_core.workspace = true
tokio.workspace = true
axum.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde.workspace = true
tower.workspace = true
url.workspace = true
libc.workspace = true
http-body-util = "0.1.3"

[dev-dependencies]
hmac = "0.13.0"
