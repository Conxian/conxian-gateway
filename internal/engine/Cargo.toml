[package]
name = "conxian_engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Conxian Gateway Engine - Core business logic for Bitcoin/Stacks gateway operations"
license = "MIT"

[dependencies]
redis.workspace = true
conxian_core = { path = "../../pkg/conxian-core" }
lib-conxian-core = { workspace = true }
bitcoin.workspace = true
bitcoincore-rpc.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
thiserror.workspace = true
hex = "0.4.3"
minreq = { version = "3.0.0", features = ["https", "json-using-serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { version = "0.13", features = ["json", "query"] }
url.workspace = true
uuid.workspace = true
bp = { package = "bp-core", version = "0.12.0", optional = true }
rgbcore = { package = "rgb-core", version = "0.12", optional = true, features = ["bitcoin", "serde"] }
rgb = { package = "rgb-std", version = "0.12.0-rc.3", optional = true }
esplora = { package = "bp-esplora", version = "0.12.0-rc.3", optional = true, default-features = false, features = ["blocking-https-rustls"] }
rgb-persist-fs = { version = "=0.12.0-rc.3", optional = true }
binfile = { version = "=0.2.0", optional = true }
strict_encoding = { version = "=2.9.1", optional = true }
commit_verify = { version = "=0.12.1", optional = true }
secp256k1 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[features]
mock-integrations = []
rgb-native = [
    "dep:bp",
    "dep:rgbcore",
    "dep:rgb",
    "dep:esplora",
    "dep:rgb-persist-fs",
    "dep:binfile",
    "dep:strict_encoding",
    "dep:commit_verify",
    "dep:secp256k1",
    "dep:fs2",
    "dep:libc",
]

[dev-dependencies]
amplify = "4.9.0"
base64 = "0.22.1"

[[test]]
name = "rgb_regtest_transition"
path = "tests/rgb_regtest_transition.rs"
required-features = ["rgb-native"]

[[test]]
name = "groth16_boundary"
path = "tests/groth16_boundary.rs"
required-features = ["mock-integrations"]
