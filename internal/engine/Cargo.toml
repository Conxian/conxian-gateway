[package]
name = "conxian_engine"
version.workspace = true
edition.workspace = true
description = "Conxian Gateway Engine - Core business logic for Bitcoin/Stacks gateway operations"
license = "MIT"

[dependencies]
redis.workspace = true
conxian_core = { path = "../../pkg/conxian-core" }
bitcoin.workspace = true
bitcoincore-rpc.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
minreq = { version = "3.0.0", features = ["https", "json-using-serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { version = "0.13", features = ["json", "query"] }
url.workspace = true
bp = { package = "bp-core", version = "0.12.0", optional = true }
rgbcore = { package = "rgb-core", version = "0.12", optional = true, features = ["bitcoin", "serde"] }
rgb = { package = "rgb-std", version = "0.12.0-rc.3", optional = true }
esplora = { package = "bp-esplora", version = "0.12.0-rc.3", optional = true, default-features = false, features = ["blocking-https-rustls"] }

[features]
rgb-native = ["dep:bp", "dep:rgbcore", "dep:rgb", "dep:esplora"]
