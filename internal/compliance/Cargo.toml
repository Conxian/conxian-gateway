quick-xml = "0.40.1"
hmac = "0.13.0"
sha2 = "0.11.0"
risc0-zkvm = { version = "5.0.0-rc.1", default-features = false, features = ["std"] }
base64 = "0.22.1"
borsh = "=1.7.0"
memchr = "2.8.1"
bytemuck = "1.21.0"
bincode = "=3.0.0"
async-trait = { workspace = true }
