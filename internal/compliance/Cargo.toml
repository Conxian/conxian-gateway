[package]
name = "conxian_compliance"
version.workspace = true
edition.workspace = true
description = "Conxian Gateway Compliance - ZK and attestation verification for institutional compliance"
license = "MIT"

[features]
mock-integrations = []

[dependencies]
conxian_core = { path = "../../pkg/conxian-core" }
serde.workspace = true
serde_json = { workspace = true }
anyhow.workspace = true
tracing.workspace = true
secp256k1 = { workspace = true, features = ["global-context", "rand-std"] }
bitcoin = { workspace = true }
hex = "0.4.3"
rand = "0.10"
chrono = { workspace = true }
serde_jcs = "0.2.0"
uuid = { version = "1.23.2", features = ["v4"] }
tokio = { workspace = true, features = ["full"] }
quick-xml = "0.41.0"
hmac = "0.13.0"
sha2 = "0.11.0"
risc0-zkvm = { version = "5.0.0-rc.1", default-features = false, features = ["std"] }
base64 = "0.22.1"
borsh = "=1.7.0"
memchr = "2.8.1"
bytemuck = "1.21.0"
async-trait = { workspace = true }
blake2 = { workspace = true }
minreq = { workspace = true, features = ["https"] }
